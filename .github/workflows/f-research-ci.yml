name: f-research-ci

# The heavy checks of the private repository Azathothas/f-research, which runs no Actions of its own. Its harness
# starts a run with the inputs sha and base; the run is named "f-research <sha> <base>", and the harness merges a head
# only when the jobs gate, harness-windows and parity of that run all succeeded. A dispatch on another branch fails.
#
# Each job fetches f-research with .github/f-research-fetch.sh of this repository: a quiet fetch with the read-only
# deploy key F_RESEARCH_DEPLOY_KEY (a secret of the environment f-research-ci, or of backup, each of which only main
# can use), which deletes the key before any code of f-research runs. Then it runs that repository's check script
# from the tested commit. This log is public. The script writes each check's output to a file on the runner and
# prints only PASS, FAIL or SKIP and the check's name; no step prints, uploads or caches a file of f-research.
#
# The script comes from the tested commit, so a change of it reaches this log when its branch is pushed, before any
# review: a merge session reads a change of that script as a change of the checks. Each run of it points the step
# summary and the step's output, environment and path files at /dev/null, which stops an accidental write to the
# public page of the run; it is not a sandbox.
#
# Every day the job lock-fresh checks f-research's pin of the Worker rules, and every Monday the job backup writes a
# git bundle of f-research to the private R2 bucket (docs/backup.md). Actions are pinned by commit; the comment names
# the tag.

run-name: >-
  f-research ${{ github.event_name == 'schedule' && (github.event.schedule == '40 6 * * *' && 'lock' || 'backup')
  || (inputs.mode == 'pr' && format('{0} {1}', inputs.sha, inputs.base) || inputs.mode) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pr: the checks of one head (sha against base); lock: the pin check; backup: the bundle"
        type: choice
        options: [pr, lock, backup]
        default: pr
      sha:
        description: "mode pr: the f-research commit to check (40 hex)"
        type: string
        default: ""
      base:
        description: "mode pr: the f-research commit it is compared with, the main it holds (40 hex)"
        type: string
        default: ""
  schedule:
    - cron: "40 6 * * *"
    - cron: "30 7 * * 1"

permissions:
  contents: read

concurrency:
  group: f-research-ci-${{ inputs.sha || github.event.schedule || inputs.mode }}-${{ inputs.base }}
  cancel-in-progress: false

jobs:
  refuse:
    # a run on another branch has no key and checks nothing; it fails, so it is never read as green
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - run: |
          echo "FAIL f-research-ci runs only on main"
          exit 1

  gate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'pr'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    environment: f-research-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/f-research-fetch.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: fshy

      - name: fetch f-research at sha, quietly
        env:
          KEY: ${{ secrets.F_RESEARCH_DEPLOY_KEY }}
          SHA: ${{ inputs.sha }}
          BASE: ${{ inputs.base }}
        run: sh fshy/.github/f-research-fetch.sh head

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: the gate comparison, the render check and the selftests
        working-directory: f-research
        env:
          BASE: ${{ inputs.base }}
          # the pin check, when the head moves the pin, asks the public API; the token only raises its rate limit
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y -q strace > /dev/null 2>&1 || true
          git config --global user.email "gate@localhost"
          git config --global user.name "gate"
          GITHUB_STEP_SUMMARY=/dev/null GITHUB_OUTPUT=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null \
            sh scripts/research/ci-checks.sh linux "$BASE"

  harness-windows:
    # the failures that matter most on the research machine (a rename with an open handle, LK_LOCK, text-mode pipes,
    # the cost of MSYS process starts) exist only on Windows; the script skips the cases when the harness did not change
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'pr'
    runs-on: windows-latest
    timeout-minutes: 40
    environment: f-research-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/f-research-fetch.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: fshy

      - name: fetch f-research at sha, quietly
        shell: bash
        env:
          KEY: ${{ secrets.F_RESEARCH_DEPLOY_KEY }}
          SHA: ${{ inputs.sha }}
          BASE: ${{ inputs.base }}
        run: sh fshy/.github/f-research-fetch.sh head

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: the harness's Windows cases and the load test
        shell: bash
        working-directory: f-research
        env:
          BASE: ${{ inputs.base }}
        run: |
          git config --global user.email "gate@localhost"
          git config --global user.name "gate"
          GITHUB_STEP_SUMMARY=/dev/null GITHUB_OUTPUT=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null \
            sh scripts/research/ci-checks.sh windows "$BASE"

  parity:
    # fr.py re-implements the public Worker's ranking, text rules and SQL guard; this runs both on the same inputs at
    # the public commit that f-research pins in scripts/fshy/public.lock
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'pr'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: f-research-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/f-research-fetch.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: fshy

      - name: fetch f-research at sha, quietly
        env:
          KEY: ${{ secrets.F_RESEARCH_DEPLOY_KEY }}
          SHA: ${{ inputs.sha }}
          BASE: ${{ inputs.base }}
        run: sh fshy/.github/f-research-fetch.sh head

      - name: the pinned public commit
        id: pin
        run: |
          sha=$(sed -n 's/^commit \([0-9a-f]\{40\}\)$/\1/p' f-research/scripts/fshy/public.lock | head -n 1)
          if [ -z "$sha" ]; then echo "FAIL parity (public.lock has no commit line)"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pin.outputs.sha }}
          persist-credentials: false
          path: f-research/.tmp/public

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: fr's twin of the Worker
        working-directory: f-research
        env:
          FSHY_PUBLIC: .tmp/public
        run: >-
          GITHUB_STEP_SUMMARY=/dev/null GITHUB_OUTPUT=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null
          sh scripts/research/ci-checks.sh parity

  lock-fresh:
    if: >-
      github.ref == 'refs/heads/main' && ((github.event_name == 'schedule' && github.event.schedule == '40 6 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'lock'))
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: f-research-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/f-research-fetch.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: fshy

      - name: fetch f-research main, quietly
        env:
          KEY: ${{ secrets.F_RESEARCH_DEPLOY_KEY }}
        run: sh fshy/.github/f-research-fetch.sh main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: the pin holds the newest public change of the Worker rules
        working-directory: f-research
        env:
          # the token only raises the API rate limit; the public repository needs none
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          GITHUB_STEP_SUMMARY=/dev/null GITHUB_OUTPUT=/dev/null GITHUB_ENV=/dev/null GITHUB_PATH=/dev/null
          sh scripts/research/ci-checks.sh lock

  backup:
    if: >-
      github.ref == 'refs/heads/main' && ((github.event_name == 'schedule' && github.event.schedule == '30 7 * * 1')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'backup'))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/f-research-fetch.sh
            .github/r2-backup.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: fshy

      - name: fetch every branch and tag of f-research, quietly
        env:
          KEY: ${{ secrets.F_RESEARCH_DEPLOY_KEY }}
        run: sh fshy/.github/f-research-fetch.sh all

      - name: bundle every branch and tag of f-research
        working-directory: f-research
        run: |
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -vx HEAD |
            while read -r b; do git update-ref "refs/heads/$b" "refs/remotes/origin/$b"; done
          git bundle create "$RUNNER_TEMP/repo.bundle" --branches --tags > /dev/null 2>&1
          git bundle verify "$RUNNER_TEMP/repo.bundle" > /dev/null 2>&1 && echo "the bundle verifies"

      - name: upload, and check the budget
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        # the script names the folder after the repository: f-research/, as the backups that f-research wrote itself
        run: GITHUB_REPOSITORY=Azathothas/f-research sh fshy/.github/r2-backup.sh "$RUNNER_TEMP/repo.bundle"
