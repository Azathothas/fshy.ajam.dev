name: build

# Builds the store, the wiki and the Worker copy from data/ alone, scans all of it for leaks, and runs the
# Worker's tests, once under node and once on workerd. A pull request from a fork must not change data/: only
# publish/export.py writes it. Commit messages and the pull request must not credit a tool.
# The actions are pinned by commit; the comment names the tag. The toolchain versions are in publish/README.md.
# Every Monday at 06:00 UTC it also builds main, so a broken toolchain shows before a publish does.
# After a green build of a push to main, or of a manual run on main, the job deploy puts the site live. It runs
# only when the repository variable FSHY_DEPLOY is "on". site/README.md, section Deploy, has the details.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a scheduled run has its own group, so it never cancels a waiting run of a push that deploys
  group: build-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  # a new push cancels the old run of a pull request; every commit of main keeps its run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: data/ changes only through a publish
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^data/'; then
            echo "data/ is written by publish/export.py only; report a correction with an issue" >&2
            exit 1
          fi

      - name: commit messages credit no tool, and each subject is under 101 characters
        if: github.event_name != 'schedule'
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then range="$BASE..$HEAD_SHA"; else range="-1 $HEAD_SHA"; fi
          fail=0
          for c in $(git rev-list --no-merges $range); do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            sh .githooks/commit-msg "$RUNNER_TEMP/msg" || { echo "in commit $c" >&2; fail=1; }
          done
          exit $fail

      # a Dependabot body quotes the release notes and the commits of another project
      - name: the pull request credits no tool, and matches no leak rule
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr"
          sh .githooks/commit-msg "$RUNNER_TEMP/pr"
          python3 publish/build.py --scan "$RUNNER_TEMP/pr"

      - name: build the store and the site, and scan for leaks
        if: hashFiles('data/meta.json') != ''
        run: python3 publish/build.py --site site/dist

      - name: Worker tests
        if: hashFiles('data/meta.json') != ''
        run: |
          cd site && npm ci --no-audit --no-fund && cd ..
          node site/worker/test/run.mjs

      - name: Worker on workerd (wrangler dev)
        if: hashFiles('data/meta.json') != ''
        run: node site/worker/test/smoke.mjs

      - name: files for agents
        if: hashFiles('data/meta.json') != ''
        run: python3 publish/test_llms.py --site site/dist

      - name: weight budget of the pages
        if: hashFiles('data/meta.json') != ''
        run: python3 publish/test_weight.py --site site/dist

      - name: publish tools
        run: python3 publish/test_publish.py

      # the job deploy deploys these files, so it deploys the bytes that the steps above checked
      - name: keep the site for the job deploy
        if: >-
          github.ref == 'refs/heads/main' && vars.FSHY_DEPLOY == 'on' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist
          retention-days: 7
          if-no-files-found: error

      # main holds a publish, so data/ that is missing is a change that removed it, and the build would skip
      - name: data/ exists
        if: hashFiles('data/meta.json') == ''
        run: |
          echo "data/meta.json is missing; a pull request must not remove data/, and the build cannot run without it" >&2
          exit 1

  # The token and the account are secrets of the environment production, and only main can use that environment.
  # The job deploys the files that the job build checked. The install runs no package script, because the secret
  # is in the same job; wrangler deploy does not need one.
  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' && vars.FSHY_DEPLOY == 'on' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.FSHY_ORIGIN || 'https://fshy.ajam.dev' }}
    env:
      FSHY_ORIGIN: ${{ vars.FSHY_ORIGIN || 'https://fshy.ajam.dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: install wrangler, with no package scripts
        run: cd site && npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site/dist

      - name: deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # The manifest, the search API and the MCP endpoint must answer from this commit. The query string of the
      # manifest skips a cached copy; the API sends the commit of its store in the header x-fshy-commit.
      - name: the live site serves this commit
        run: |
          fail() {
            echo "$1" >&2
            echo "The new version can be live. site/README.md, section Deploy, says how to go back." >&2
            exit 1
          }
          get() { curl -fsS --max-time 20 --retry 2 "$@"; }
          # Right after the deploy, the domain can answer with an error page or with an empty body. A poll that does
          # not return the manifest prints one short line, and the loop tries again. Only the last try can fail.
          manifest="$RUNNER_TEMP/manifest.json"
          got=""
          code=""
          for i in $(seq 1 30); do
            rm -f "$manifest"
            code=$(curl -s --max-time 20 --retry 2 -o "$manifest" -w '%{http_code}' "$FSHY_ORIGIN/data/manifest.json?v=$GITHUB_SHA") ||
              code="no answer"
            got=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["commit"])' "$manifest" 2>/dev/null) || got=""
            [ "$got" = "$GITHUB_SHA" ] && break
            if [ -n "$got" ]; then
              echo "poll $i of 30: the manifest names the commit $got"
            else
              echo "poll $i of 30: HTTP $code, and the answer is not the manifest"
            fi
            sleep 10
          done
          if [ "$got" != "$GITHUB_SHA" ]; then
            [ -z "$got" ] || fail "the live manifest names the commit '$got', not $GITHUB_SHA"
            fail "the live manifest was not JSON with a commit in 30 tries; the last answer was HTTP $code"
          fi
          hdr=$(get -D - -o "$RUNNER_TEMP/search.json" "$FSHY_ORIGIN/api/v1/search?q=storage&limit=1" |
            tr -d '\r' | awk -F': ' 'tolower($1) == "x-fshy-commit" { print $2 }')
          [ "$hdr" = "$GITHUB_SHA" ] || fail "the search API answers from the commit '$hdr', not $GITHUB_SHA"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["rows"]' "$RUNNER_TEMP/search.json" ||
            fail "the search API answers with no rows"
          get -o "$RUNNER_TEMP/mcp.json" -X POST -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc": "2.0", "id": 1, "method": "tools/list"}' "$FSHY_ORIGIN/mcp" ||
            fail "the MCP endpoint does not answer tools/list"
          python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["result"]["tools"]' "$RUNNER_TEMP/mcp.json" ||
            fail "the MCP endpoint lists no tools"
          echo "live: $FSHY_ORIGIN serves $GITHUB_SHA"

      # One request of each route proves little: a fault of some isolates hangs some requests only (issue #26). This
      # step abandons 16 requests during the first loads of the store, as clients that time out do, then sends 40
      # requests to the routes that open the store. A request with no answer in LOAD_WAIT_MS plus 5 s fails the job.
      - name: the store routes answer a burst of requests, and none hangs
        run: |
          node site/worker/test/live.mjs "$FSHY_ORIGIN" || {
            echo "The new version can be live. site/README.md, section Deploy, says how to go back." >&2
            exit 1
          }
