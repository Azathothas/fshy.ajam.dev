# Weekly version updates, on Monday at 04:00 UTC, two hours before the scheduled build of build.yml.
# Each update is a pull request that CI checks like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    commit-message:
      prefix: site
    groups:
      npm:
        patterns: ["*"]
    # the site serves a copy of MiniSearch, site/static/assets/minisearch.js: an update of it fails run.mjs until a
    # person copies the new dist/umd/index.js there, so the update is not forgotten
