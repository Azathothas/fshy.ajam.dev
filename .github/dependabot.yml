# Weekly version updates, on Monday at 04:00 UTC, two hours before the scheduled build of build.yml.
# Each update is a pull request that CI checks like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    commit-message:
      prefix: site
    # The site serves a copy of MiniSearch, site/static/assets/minisearch.js. An update of MiniSearch fails run.mjs
    # until a person copies the new dist/umd/index.js there, so the update is not forgotten. That pull request has a
    # group of its own, so the failed check holds only MiniSearch and not the other updates.
    groups:
      minisearch:
        patterns: ["minisearch"]
      npm:
        patterns: ["*"]
        exclude-patterns: ["minisearch"]
