name: New offer
description: A free, nearly free or cheap offer that the catalogue does not have.
labels: ["report"]
body:
  - type: markdown
    attributes:
      value: |
        A report is a lead. A research lane reads the provider's own pages and records what they say.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - storage
        - netdisk-pan
        - compute
        - coding-subs
        - inference
        - crawler-scraper
        - debrid
        - egress
        - email
        - databases-kv
        - domains-dns
        - ci-cd-runners
        - ip-proxy
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider
      description: The name of the provider and of the offer.
    validations:
      required: true
  - type: textarea
    id: offer
    attributes:
      label: What it offers
      description: The quota or the price, and what a signup needs, as the provider states them.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: The URL of the provider's own page, and the date you read it.
    validations:
      required: true
