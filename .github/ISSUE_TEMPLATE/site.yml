name: Site or tool problem
description: The wiki, the API, the MCP endpoint or a publish tool does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        An error in a record is a Correction, not a site problem.
        ⚠ Do not paste a key, a password or a personal detail. For a vulnerability, use the security policy.
  - type: input
    id: where
    attributes:
      label: Where
      description: The page, the API route, the MCP tool or the file, for example /api/v1/search?q=gpu.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, and what you got.
    validations:
      required: true
