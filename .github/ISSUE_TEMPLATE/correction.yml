name: Correction
description: A record states something that the provider's own page contradicts.
labels: ["report"]
title: "Correction: "
body:
  - type: markdown
    attributes:
      value: |
        A report is a lead. A research lane checks it against the provider's own pages before a record changes.
        Give the record, what is wrong, and a link to the provider's page.
        ⚠ Do not paste a key, a password or a personal detail. Do not paste terms text: give the link.
        A leaked secret or a personal detail in the catalogue is a security report, not a correction.
  - type: input
    id: record
    attributes:
      label: Record
      description: The record path without .json, for example inference/groq.
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: The field, what the record says, and what the provider says now.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: The URL of the provider's own page that shows the correct value, and the date you read it.
    validations:
      required: true
